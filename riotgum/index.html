<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riot Gum — Caffeinated Gum. For the Doers.</title>
<meta name="description" content="Riot Gum. Caffeinated gum for the doers. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --muted: #a3a3a3;
    --accent: #e63329;
    --accent-dark: #c2271f;
    --line: #2a2a2a;
    --input: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    line-height: 1.6;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; width: 100%; }
  nav { border-bottom: 1px solid var(--line); }
  .nav-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav-brand {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 1px;
    color: var(--text);
    text-decoration: none;
    margin-right: auto;
  }
  .nav-inner a.hub {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .nav-inner a.hub:hover { color: var(--text); }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    text-align: center;
    padding: 64px 0;
  }
  .eyebrow {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: clamp(4.5rem, 20vw, 10rem);
    line-height: 0.9;
    font-weight: 400;
    text-transform: uppercase;
  }
  .tagline {
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 20px;
  }
  .sub {
    font-size: 1.15rem;
    color: var(--muted);
    margin-top: 12px;
  }
  form {
    margin-top: 36px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  form input[type="email"] {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--input);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    width: min(100%, 320px);
  }
  form input[type="email"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  form input[type="email"]::placeholder { color: var(--muted); }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-family: 'Anton', 'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--accent-dark); }
  .form-note {
    font-size: 0.95rem;
    color: var(--muted);
    margin-top: 16px;
  }
  footer {
    padding: 28px 0 36px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="#top">RIOT GUM</a>
    <a class="hub" href="https://brandonhoffmann.com">brandonhoffmann.com</a>
  </div>
</nav>

<main id="top">
  <div class="wrap">
    <p class="eyebrow">Caffeinated Gum</p>
    <h1>Riot<br>Gum</h1>
    <p class="tagline">For the doers.</p>
    <p class="sub">Coming soon.</p>
    <form action="https://api.sheetmonkey.io/form/7p6rBz4MAUvemgNJfH3DEf" method="POST">
      <input type="hidden" name="Form" value="Riot Gum signup">
      <input type="email" name="Email" placeholder="Your email" required aria-label="Email address">
      <button class="btn" type="submit">Notify me</button>
    </form>
    <p class="form-note">Be first to know when it launches.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>&copy; 2026 Riot Gum &middot; <a href="https://brandonhoffmann.com">brandonhoffmann.com</a></p>
  </div>
</footer>

</body>
</html>
